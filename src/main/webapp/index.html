
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Survey</title>

    <link rel="stylesheet"
          href="styles/main.css"
          type="text/css">
</head>

<body>

<!-- Image -->
<img src="https://i.pinimg.com/736x/9e/c3/32/9ec332e4395109bafd9e28a69b6b0832.jpg"
     alt="Messi"
     width="100">

<h1>Survey</h1>

<p>
    If you have a moment, we'd appreciate it if you would fill out this survey.
</p>

<hr>

<h2>Your information:</h2>

<!-- FORM -->
<form action="emaillist" method="post">

    <!-- FIRST NAME -->
    <p>
        <label for="firstName">First Name:</label>

        <input type="text"
               id="firstName"
               name="firstName">
    </p>

    <!-- LAST NAME -->
    <p>
        <label for="lastName">Last Name:</label>

        <input type="text"
               id="lastName"
               name="lastName">
    </p>

    <!-- EMAIL -->
    <p>
        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email">
    </p>

    <!-- DATE OF BIRTH -->
    <p>
        <label for="dateOfBirth">Date of birth:</label>

        <input type="text"
               id="dateOfBirth"
               name="dateOfBirth">
    </p>
    <!-- SOURCE -->
    <h2>How did you hear about Messi?</h2>

    <p>

        <input type="radio"
               id="search"
               name="source"
               value="Messi mua cup">

        <label for="search">
            Messi mua cup
        </label>


        <input type="radio"
               id="word"
               name="source"
               value="Messi la con cua fifa">

        <label for="word">
            Messi la con cua FIFA
        </label>


        <input type="radio"
               id="social"
               name="source"
               value="Messi mua tai">

        <label for="social">
            Messi mua tai
        </label>


        <input type="radio"
               id="other"
               name="source"
               value="Khac">

        <label for="other">
            Other
        </label>

    </p>


    <!-- ANNOUNCEMENT -->
    <h2>
        Ban co muon lam fan anh Cristiano
        <br>
        Ronaldo aka anh bay dep trai
    </h2>

    <p>

        <input type="checkbox"
               id="offers"
               name="offers"
               value="yes">

        <label for="offers">
            YES, I'd like that.
        </label>

    </p>


    <p>

        <input type="checkbox"
               id="emailAnnouncements"
               name="emailAnnouncements"
               value="yes">

        <label for="emailAnnouncements">
            YES, please send me email announcements.
        </label>

    </p>


    <!-- CONTACT -->
    <p>

        <label for="contact">
            Please contact me by:
        </label>

        <select id="contact"
                name="contact">

            <option value="email_or_postal">
                Email or postal mail
            </option>

            <option value="email">
                Email
            </option>

            <option value="postal">
                Postal mail
            </option>

        </select>

    </p>


    <!-- SUBMIT -->
    <input type="submit" value="Submit">

</form>

</body>
</html>
